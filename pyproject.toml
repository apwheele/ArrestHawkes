[project]
name = "arresthawkes"
version = "0.1.0"
description = "Self-exciting point process for crime in which an arrest dampens triggering"
readme = "README.md"
authors = [
    { name = "apwheele", email = "apwheele@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pypdf>=7.1.0",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
